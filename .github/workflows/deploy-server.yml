name: Deploy to HK Server

# 推送到 main 且涉及网站代码时，自动构建并部署到香港服务器
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 43.161.232.24 >> ~/.ssh/known_hosts

      - name: Upload new release
        run: |
          ssh -i ~/.ssh/deploy_key -p 22 -o PasswordAuthentication=no root@43.161.232.24 "mkdir -p /var/www/cqbuddy/releases/run${{ github.run_id }}"
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -p 22 -o PasswordAuthentication=no" web/dist/ root@43.161.232.24:/var/www/cqbuddy/releases/run${{ github.run_id }}/

      - name: Switch live release
        run: |
          ssh -i ~/.ssh/deploy_key -p 22 -o PasswordAuthentication=no root@43.161.232.24 "
            ln -sfn /var/www/cqbuddy/releases/run${{ github.run_id }} /var/www/cqbuddy/current &&
            systemctl reload nginx &&
            cd /var/www/cqbuddy/releases && ls -1t | tail -n +6 | xargs -r rm -rf &&
            echo SWITCHED
          "

      - name: Health check
        run: |
          sleep 2
          CODE=$(curl -fsS -o /dev/null -w '%{http_code}' https://www.cqbuddy.com/en/ || true)
          echo "HTTP $CODE"
          [ "$CODE" = "200" ] || exit 1
